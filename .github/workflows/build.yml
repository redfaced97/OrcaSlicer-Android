name: Build OrcaPocket
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore matching native engine
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: native-out
          key: engine-v1-${{ hashFiles('native/**') }}
      - name: Use engine built from this source tree
        if: steps.engine.outputs.cache-hit == 'true'
        run: mkdir -p app/src/main/jniLibs && cp -r native-out/. app/src/main/jniLibs/
      - name: Fetch verified upstream engine if unchanged
        if: steps.engine.outputs.cache-hit != 'true'
        run: bash scripts/fetch-prebuilt-engine.sh
      - name: Fetch pinned Orca resources
        run: ORCAMICRO_ORCA_DIR="$RUNNER_TEMP/orca" bash native/scripts/fetch-orca.sh --profiles-only
      - name: Tests and APKs
        run: >-
          sh ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          -PorcaResourcesDir="$RUNNER_TEMP/orca/resources"
          -PsourceUrl="https://github.com/$GITHUB_REPOSITORY"
          --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OrcaPocket-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: engine-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: core/build/reports/tests
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-test-apks
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072 -camera-back none
          script: |
            adb install -r dist/debug/app-debug.apk
            adb install -r dist/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w io.github.redfaced97.orcapocket.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q '^OK (' instrument.txt
